<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="736" viewBox="0 0 1200 736" role="img" aria-labelledby="title desc">
<title id="title">NEXIS architecture</title><desc id="desc">Text requests go through Express to Qdrant, Gemini and Rime. Voice uses a LiveKit room and Python worker with STT, Qdrant, Gemini and Rime. Express creates tokens and dispatches the worker.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7baaff" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7baaff" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="736" rx="20" fill="#070b14"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="44" fill="#89deed" font-size="13" font-weight="600" letter-spacing="2">THE SYSTEM / TWO CONVERSATION PATHS</text><text x="40" y="88" fill="#edf3ff" font-size="32" font-weight="600" >One interface. Two execution paths.</text><text x="40" y="119" fill="#a4b3cb" font-size="18" font-weight="400" >Express handles typed requests. A separate Python worker handles live voice.</text><rect x="28" y="148" width="1144" height="230" rx="16" fill="#0a101c" stroke="#243349"/><text x="48" y="178" fill="#7baaff" font-size="13" font-weight="600" letter-spacing="1.5">01   TEXT · HTTP</text><rect x="48" y="208" width="210" height="84" rx="16" fill="#0e1523" stroke="#243349"/><rect x="49" y="226" width="3" height="48" rx="1" fill="#7baaff"/><text x="68" y="241" fill="#edf3ff" font-size="20" font-weight="600" >React browser</text><text x="68" y="267" fill="#a4b3cb" font-size="14" font-weight="400" >Typed message + history</text><rect x="316" y="208" width="220" height="84" rx="16" fill="#0e1523" stroke="#243349"/><rect x="317" y="226" width="3" height="48" rx="1" fill="#7baaff"/><text x="336" y="241" fill="#edf3ff" font-size="20" font-weight="600" >Express API</text><text x="336" y="267" fill="#a4b3cb" font-size="14" font-weight="400" >Chat + TTS endpoints</text><path d="M258 250 L312 250" fill="none" stroke="#7baaff" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="790" y="194" width="345" height="48" rx="10" fill="#0e1523" stroke="#243349"/><text x="808" y="223" fill="#edf3ff" font-size="17" font-weight="600" >Qdrant</text><text x="895" y="223" fill="#a4b3cb" font-size="14" font-weight="400" >Retrieve + selected writes</text><path d="M536 250 H650 V218 H785" stroke="#7baaff" fill="none" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="790" y="250" width="345" height="48" rx="10" fill="#0e1523" stroke="#243349"/><text x="808" y="279" fill="#edf3ff" font-size="17" font-weight="600" >Gemini</text><text x="895" y="279" fill="#a4b3cb" font-size="14" font-weight="400" >Generate short responses</text><path d="M536 250 H650 V274 H785" stroke="#7baaff" fill="none" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="790" y="306" width="345" height="48" rx="10" fill="#0e1523" stroke="#243349"/><text x="808" y="335" fill="#edf3ff" font-size="17" font-weight="600" >Rime</text><text x="895" y="335" fill="#a4b3cb" font-size="14" font-weight="400" >Speech via /api/tts</text><path d="M536 250 H650 V330 H785" stroke="#7baaff" fill="none" stroke-width="1.4" marker-end="url(#arrow)"/><text x="48" y="344" fill="#a4b3cb" font-size="15" font-weight="400" >Vite in development · built frontend served by Express in production</text><rect x="28" y="398" width="1144" height="270" rx="16" fill="#0a101c" stroke="#243349"/><text x="48" y="428" fill="#c4adff" font-size="13" font-weight="600" letter-spacing="1.5">02   VOICE · LIVEKIT ROOM</text><rect x="48" y="458" width="210" height="84" rx="16" fill="#0e1523" stroke="#243349"/><rect x="49" y="476" width="3" height="48" rx="1" fill="#c4adff"/><text x="68" y="491" fill="#edf3ff" font-size="20" font-weight="600" >React browser</text><text x="68" y="517" fill="#a4b3cb" font-size="14" font-weight="400" >Microphone + transcripts</text><rect x="302" y="458" width="180" height="84" rx="16" fill="#0e1523" stroke="#243349"/><rect x="303" y="476" width="3" height="48" rx="1" fill="#c4adff"/><text x="322" y="491" fill="#edf3ff" font-size="20" font-weight="600" >LiveKit</text><text x="322" y="517" fill="#a4b3cb" font-size="14" font-weight="400" >Audio + RPC</text><rect x="526" y="458" width="215" height="84" rx="16" fill="#0e1523" stroke="#243349"/><rect x="527" y="476" width="3" height="48" rx="1" fill="#c4adff"/><text x="546" y="491" fill="#edf3ff" font-size="20" font-weight="600" >Python worker</text><text x="546" y="517" fill="#a4b3cb" font-size="14" font-weight="400" >AgentSession</text><path d="M258 500 L297 500" fill="none" stroke="#7baaff" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M482 500 L521 500" fill="none" stroke="#7baaff" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M741 500 L788 500" fill="none" stroke="#7baaff" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="794" y="446" width="341" height="194" rx="16" fill="#0e1523" stroke="#243349"/><text x="814" y="480" fill="#edf3ff" font-size="17" font-weight="600" >STT</text><text x="890" y="480" fill="#a4b3cb" font-size="14" font-weight="400" >LiveKit Inference / Deepgram</text><text x="814" y="523" fill="#edf3ff" font-size="17" font-weight="600" >Qdrant</text><text x="890" y="523" fill="#a4b3cb" font-size="14" font-weight="400" >Seed + retrieve context</text><text x="814" y="566" fill="#edf3ff" font-size="17" font-weight="600" >Gemini</text><text x="890" y="566" fill="#a4b3cb" font-size="14" font-weight="400" >Generate response</text><text x="814" y="609" fill="#edf3ff" font-size="17" font-weight="600" >Rime</text><text x="890" y="609" fill="#a4b3cb" font-size="14" font-weight="400" >Stream synthesized speech</text><text x="48" y="588" fill="#89deed" font-size="12" font-weight="600" letter-spacing="2">SETUP</text><text x="48" y="614" fill="#a4b3cb" font-size="16" font-weight="400" >Express issues the room token and dispatches matrix-core-agent.</text><text x="48" y="642" fill="#a4b3cb" font-size="15" font-weight="400" >Worker audio returns through LiveKit; state and transcript events update the browser.</text><text x="40" y="704" fill="#a4b3cb" font-size="15" font-weight="400" >Memory is filtered by user_id + workflow. The demo browser uses a shared demo-user identity.</text></g></svg>