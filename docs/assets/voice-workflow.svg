<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="596" viewBox="0 0 1200 596" role="img" aria-labelledby="title desc">
<title id="title">AURA voice workflow</title><desc id="desc">Connect, start a voice turn, commit it, retrieve memory, generate and synthesize a response, then continue. Starting a new turn interrupts speech.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7baaff" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7baaff" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="596" rx="20" fill="#070b14"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="44" fill="#89deed" font-size="13" font-weight="600" letter-spacing="2">FROM MICROPHONE TO RESPONSE</text><text x="40" y="87" fill="#edf3ff" font-size="32" font-weight="600" >A voice turn, step by step.</text><rect x="40" y="122" width="352" height="164" rx="16" fill="#0e1523" stroke="#243349"/><text x="62" y="153" fill="#89deed" font-size="14" font-weight="600" >01</text><text x="62" y="188" fill="#edf3ff" font-size="27" font-weight="600" >Connect</text><text x="62" y="224" fill="#c4adff" font-size="17" font-weight="600" >Token + agent dispatch</text><text x="62" y="255" fill="#a4b3cb" font-size="16" font-weight="400" >Join the LiveKit room.</text><path d="M394 202 L418 202" fill="none" stroke="#7baaff" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="424" y="122" width="352" height="164" rx="16" fill="#0e1523" stroke="#243349"/><text x="446" y="153" fill="#89deed" font-size="14" font-weight="600" >02</text><text x="446" y="188" fill="#edf3ff" font-size="27" font-weight="600" >Speak</text><text x="446" y="224" fill="#c4adff" font-size="17" font-weight="600" >start_turn RPC</text><text x="446" y="255" fill="#a4b3cb" font-size="16" font-weight="400" >Interrupt, clear, enable audio.</text><path d="M778 202 L802 202" fill="none" stroke="#7baaff" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="808" y="122" width="352" height="164" rx="16" fill="#0e1523" stroke="#243349"/><text x="830" y="153" fill="#89deed" font-size="14" font-weight="600" >03</text><text x="830" y="188" fill="#edf3ff" font-size="27" font-weight="600" >Commit</text><text x="830" y="224" fill="#c4adff" font-size="17" font-weight="600" >end_turn RPC</text><text x="830" y="255" fill="#a4b3cb" font-size="16" font-weight="400" >Disable audio; commit turn.</text><rect x="40" y="312" width="352" height="164" rx="16" fill="#0e1523" stroke="#243349"/><text x="62" y="343" fill="#89deed" font-size="14" font-weight="600" >04</text><text x="62" y="378" fill="#edf3ff" font-size="27" font-weight="600" >Retrieve</text><text x="62" y="414" fill="#c4adff" font-size="17" font-weight="600" >Qdrant context</text><text x="62" y="445" fill="#a4b3cb" font-size="16" font-weight="400" >Filter by user and workflow.</text><path d="M394 392 L418 392" fill="none" stroke="#7baaff" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="424" y="312" width="352" height="164" rx="16" fill="#0e1523" stroke="#243349"/><text x="446" y="343" fill="#89deed" font-size="14" font-weight="600" >05</text><text x="446" y="378" fill="#edf3ff" font-size="27" font-weight="600" >Respond</text><text x="446" y="414" fill="#c4adff" font-size="17" font-weight="600" >Gemini → Rime</text><text x="446" y="445" fill="#a4b3cb" font-size="16" font-weight="400" >Generate text, then speech.</text><path d="M778 392 L802 392" fill="none" stroke="#7baaff" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="808" y="312" width="352" height="164" rx="16" fill="#0e1523" stroke="#243349"/><text x="830" y="343" fill="#89deed" font-size="14" font-weight="600" >06</text><text x="830" y="378" fill="#edf3ff" font-size="27" font-weight="600" >Continue</text><text x="830" y="414" fill="#c4adff" font-size="17" font-weight="600" >Audio + transcript</text><text x="830" y="445" fill="#a4b3cb" font-size="16" font-weight="400" >Return through LiveKit.</text><path d="M984 286 V299 H216 V309" fill="none" stroke="#7baaff" stroke-width="1.4" marker-end="url(#arrow)"/><text x="40" y="527" fill="#89deed" font-size="12" font-weight="600" letter-spacing="2">NEXT TURN</text><text x="170" y="527" fill="#a4b3cb" font-size="17" font-weight="400" >Click the microphone again to interrupt and start speaking.</text><text x="40" y="560" fill="#a4b3cb" font-size="15" font-weight="400" >cancel_turn clears an aborted input. Illustration describes code flow, not measured timing.</text></g></svg>