<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="44" fill="#89deed" font-size="13" font-weight="600" letter-spacing="2">THREE EXPERIENCES / SHARED VOICE STACK</text><rect x="40" y="78" width="352" height="290" rx="16" fill="#0e1523" stroke="#243349"/><text x="64" y="114" fill="#7baaff" font-size="14" font-weight="600" >01</text><circle cx="335" cy="113" r="18" fill="none" stroke="#7baaff" stroke-width="1.6"/><circle cx="335" cy="113" r="10" fill="none" stroke="#7baaff"/><text x="64" y="165" fill="#edf3ff" font-size="27" font-weight="600" >Food ordering</text><text x="64" y="199" fill="#7baaff" font-size="17" font-weight="400" >Preference → suggestion</text><path d="M64 224 H368" stroke="#243349"/><text x="64" y="257" fill="#a4b3cb" font-size="17" font-weight="400" >Dietary preferences</text><text x="64" y="289" fill="#a4b3cb" font-size="17" font-weight="400" >Previous order context</text><text x="64" y="321" fill="#a4b3cb" font-size="17" font-weight="400" >Conversational order changes</text><rect x="424" y="78" width="352" height="290" rx="16" fill="#0e1523" stroke="#243349"/><text x="448" y="114" fill="#c4adff" font-size="14" font-weight="600" >02</text><path d="M694 113 h12 l7 -15 10 29 7 -14 h18" fill="none" stroke="#c4adff" stroke-width="2"/><text x="448" y="165" fill="#edf3ff" font-size="27" font-weight="600" >Healthcare</text><text x="448" y="199" fill="#c4adff" font-size="17" font-weight="400" >Request → guidance</text><path d="M448 224 H752" stroke="#243349"/><text x="448" y="257" fill="#a4b3cb" font-size="17" font-weight="400" >Appointment-related help</text><text x="448" y="289" fill="#a4b3cb" font-size="17" font-weight="400" >General information</text><text x="448" y="321" fill="#a4b3cb" font-size="17" font-weight="400" >Non-diagnostic instructions</text><rect x="808" y="78" width="352" height="290" rx="16" fill="#0e1523" stroke="#243349"/><text x="832" y="114" fill="#89deed" font-size="14" font-weight="600" >03</text><path d="M1083 118 q20 26 40 0 Z M1093 108 q-8 -8 0 -16 M1106 108 q-8 -8 0 -16 M1118 108 q-8 -8 0 -16" fill="none" stroke="#89deed" stroke-width="1.8"/><text x="832" y="165" fill="#edf3ff" font-size="27" font-weight="600" >Home cooking</text><text x="832" y="199" fill="#89deed" font-size="17" font-weight="400" >Recipe → next step</text><path d="M832 224 H1136" stroke="#243349"/><text x="832" y="257" fill="#a4b3cb" font-size="17" font-weight="400" >Recipe context</text><text x="832" y="289" fill="#a4b3cb" font-size="17" font-weight="400" >Ingredient substitutions</text><text x="832" y="321" fill="#a4b3cb" font-size="17" font-weight="400" >Short spoken instructions</text><text x="40" y="406" fill="#a4b3cb" font-size="16" font-weight="400" >Conversational demos: no checkout, booking backend, diagnosis, or prescription integration.</text></g></svg>