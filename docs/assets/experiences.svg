<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Three implemented experiences</title><desc id="desc">Food ordering uses dietary and order context. Healthcare provides administrative and general information. Cooking provides recipe steps and substitutions. These are conversational demos.</desc>
